# ==============================================================================
# example.yml - the configuration of the shipped example
#
# The example is a small synthetic cohort (data-example/, chromosomes 21 and 22).
# A stage script that gets no --config reads this file. It sets only what the
# example needs to differ from base-config/base_config.yml, which lists every
# setting with its default and a description.
#
# To configure your own study, do not edit this file. Write a file of your own with
# `dataset`, the paths of your data under `data`, and the settings you want to
# change. A file without an `extends` line builds on base_config.yml.
#
# Results go to <output_root>/<dataset>/<analysis>/, here runs/example/baseline/.

# dataset, analysis and output_root keep their defaults: example, baseline, runs.
# The raw inputs under `data` keep their defaults too, which are the example's files.

shared:
  chroms: [21, 22]                 # the example has two chromosomes
  pi_features:                     # the 16 annotations behind the PI models
    - apc_conservation_v2
    - apc_epigenetics
    - apc_epigenetics_active
    - apc_epigenetics_repressed
    - apc_epigenetics_transcription
    - apc_protein_function_v3
    - apc_local_nucleotide_diversity_v3
    - apc_mutation_density
    - apc_transcription_factor
    - apc_mappability
    - apc_proximity_to_tsstes
    - apc_proximity_to_coding_v2
    - apc_micro_rna
    - cadd_phred
    - linsight
    - fathmm_xf

data_prep:
  gds_pattern: "chr{chr}.gds"
  favor_gds_pattern: "chr{chr}_favor.gds"
  favor_csv_pattern: "chr{chr}_favor.csv"
  favor_features:                  # the PI features and the three fields of the coding masks
    - apc_conservation_v2
    - apc_epigenetics
    - apc_epigenetics_active
    - apc_epigenetics_repressed
    - apc_epigenetics_transcription
    - apc_protein_function_v3
    - apc_local_nucleotide_diversity_v3
    - apc_mutation_density
    - apc_transcription_factor
    - apc_mappability
    - apc_proximity_to_tsstes
    - apc_proximity_to_coding_v2
    - apc_micro_rna
    - cadd_phred
    - linsight
    - fathmm_xf
    - genecode_comprehensive_category
    - genecode_comprehensive_exonic_category
    - metasvm_pred
  pc_source: gds                   # PCs from the converted GDS files
  n_pcs: 5                         # a small cohort needs a handful of PCs
  pc_ld_threshold: 0.5             # a lenient pruning, because the variants are few
  pcs:
    cols: [PC1, PC2, PC3, PC4, PC5]

training:
  favor_features:                  # the PI cases are annotated with the PI features only
    - apc_conservation_v2
    - apc_epigenetics
    - apc_epigenetics_active
    - apc_epigenetics_repressed
    - apc_epigenetics_transcription
    - apc_protein_function_v3
    - apc_local_nucleotide_diversity_v3
    - apc_mutation_density
    - apc_transcription_factor
    - apc_mappability
    - apc_proximity_to_tsstes
    - apc_proximity_to_coding_v2
    - apc_micro_rna
    - cadd_phred
    - linsight
    - fathmm_xf
  b_qc_filters:
    min_sample_size: 100
    max_pvalue: 1
    min_maf: 0
    remove_duplicates: true
    duplicate_priority: "N"
    remove_na: true
    remove_na_cols: [MAF, P, "N"]
  pi_n_models: 5
  pi_controls_multiplier: 2        # two controls per case, because the cases are few
  pi_max_controls: 5000
  pi_eval_max_controls: 2000
  pi_chromosomes: [21, 22]
  pi_control_format: gds           # the controls come from the annotated GDS files

snv_set:
  region_type: [gene, window, coding]
  top_k: 20                        # a short table of top genes for a small cohort
  window_size: 50000               # 50 kb windows
  step_size: 25000                 # 25 kb step
  categories: [plof, missense, disruptive_missense, synonymous]
  staar_bakein_glow: false         # the coding run has no STAAR comparator
