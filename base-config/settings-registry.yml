    The number of control variants per model, as a multiple of the number of cases.

- name: pi_max_controls
  section: training
  type: integer
  null_ok: true
  default: 50000
  was: {file: training_base.R}
  description: >-
    The largest number of control variants loaded for training, which bounds the memory.
    Null loads all of them.

- name: pi_model_type
  section: training
  type: string
  choices: [GLM, LASSO]
  default: LASSO
  was: {file: training_base.R}
  description: >-
    The kind of model in the PI ensemble.

- name: pi_chromosomes
  section: training
  type: integer_list
  default: 1-22
  was: {file: training_base.R}
  description: >-
    The chromosomes from which control variants are drawn.

- name: pi_random_seed
  section: training
  type: integer
  default: 42
  was: {file: training_base.R}
  description: >-
    The random seed of the PI training and of its evaluation.

- name: pi_models_subdir
  section: training
  type: file_name
  default: pi_models
  was: {file: training_base.R}
  description: >-
    The folder, under the training output, into which the PI models are written.

- name: pi_models_dir
  section: training
