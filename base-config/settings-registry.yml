    The largest number of control variants loaded for the evaluation. Fewer is faster and
    noisier. Null loads all of them.

- name: pi_n_eval_controls
  section: training
  type: integer
  null_ok: true
  default: ~
  was: {file: training_base.R}
  description: >-
    The number of control variants sampled for the ROC curve. Null uses all that were
    loaded.

# ---- single_variant: the scan, the LD scores, the calibration ----------------------

- name: use_spa
  section: single_variant
  type: logical
  default: true
  was: {file: single_variant_base.R, name: use_SPA}
  description: >-
    Whether the single-variant scan uses the saddlepoint approximation, which is meant for a
    binary trait with rare variants.

- name: chunk_size
  section: single_variant
  type: integer
  default: 2000
  was: {file: single_variant_base.R}
  description: >-
    The number of variants read at a time by the scan.

- name: mac_cutoff
  section: single_variant
  type: integer
  default: 1
  was: {file: single_variant_base.R}
  description: >-
    The smallest minor allele count of a variant that is scanned. One scans every variant
    that varies in the cohort.

- name: missing_imputation
  section: single_variant
  type: string
  choices: [mean, zero]
  default: mean
  was: {file: single_variant_base.R}
  description: >-
    How a missing genotype is filled in.

- name: ld_window
  section: single_variant
  type: integer
  default: 1000000
  was: {file: single_variant_base.R}
  description: >-
    The half-width, in base pairs, of the window over which a variant's LD score is summed.

- name: ld_segment
  section: single_variant
  type: integer
  default: 2000
  was: {file: single_variant_base.R}
  description: >-
    The number of variants per block of the LD-score computation.

- name: ld_sample_n
  section: single_variant
  type: integer
  default: 0
  was: {file: single_variant_base.R}
  description: >-
    The number of individuals sampled for the LD scores. Zero uses all of them.

- name: ld_ref_maf_min
  section: single_variant
  type: number
  default: 0
  was: {file: single_variant_base.R}
  description: >-
    The minor allele frequency a variant needs to enter the LD scores, as a target and as a
    neighbor. Zero takes every biallelic SNV. 0.01 is the usual choice on whole-genome data,
    where the table of all SNVs is out of reach. Above zero the LD step reads the
    frequencies from this analysis's single-variant table, so the scan has to run first. The
    threshold can change the estimated LD score regression intercept, so validate the
    calibration on the cohort.

- name: calibration_method
  section: single_variant
  type: string
  choices: [ldsc_intercept, lambda_gc]
  default: ldsc_intercept
  was: {file: single_variant_base.R}
  description: >-
    How the inflation factor is estimated: ldsc_intercept is the intercept of LD score
    regression, which needs the LD scores and keeps polygenic signal apart from confounding,
    and lambda_gc is the genomic-control lambda.

- name: lambda_mac_min
  section: single_variant
  type: integer
  default: 20
  was: {file: single_variant_base.R}
  description: >-
    The smallest minor allele count of the variants on which the headline lambda of the
    calibration report is computed.

- name: ld_scores_path
  section: single_variant
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: single_variant_base.R}
  description: >-
    A table of LD scores computed elsewhere, for the calibration to read. Null takes the
    scores this analysis's LD step wrote.

# ---- snv_set: the set-based scans and their summary -------------------------------

- name: region_type
  section: snv_set
  type: string_list
  choices: [gene, window, coding, noncoding]
  default: [gene]
  was: {file: snv_set_base.R}
  description: >-
    The kinds of SNV sets to scan, each written to a folder of its own: gene tests the
    variants of each gene, window tests sliding windows, coding tests each gene by coding
    category, and noncoding tests each gene by noncoding mask.

- name: filter_spec
  section: snv_set
  type: map
  fields:
    qc_label: {type: string}
    qc_pass_value: {type: string}
    variant_type: {type: string, choices: [SNV, Indel, variant]}
    annotation_clauses:
      type: sequence
      null_ok: true
      items: &clause
        type: map
        values:
          type: one_of
          one_of:
            - {type: string_list}
            - type: map
              required: [op, value]
              fields: {op: {type: string, choices: [in, not_in]}, value: {type: string_list}}
            - type: map
              required: [op, value]
              fields: {op: {type: string, choices: [gt, ge, lt, le]}, value: {type: number, inf_ok: true}}
            - type: map
              required: [op]
              fields: {op: {type: string, choices: [nonempty, empty]}}
    rare_maf_cutoff: {type: number}
    min_mac: {type: integer}
    min_variants: {type: integer}
  default:
    qc_label: annotation/filter
    qc_pass_value: PASS
    variant_type: SNV
    annotation_clauses: ~
    rare_maf_cutoff: 0.5
    min_mac: 1
    min_variants: 1
  was: {file: snv_set_base.R}
  description: >-
    Which variants enter a set. qc_label and qc_pass_value name the quality-control field of
    the GDS file and the value that passes. variant_type is SNV, Indel or variant (both).
    rare_maf_cutoff is the largest minor allele frequency: 0.5 keeps the whole spectrum,
    which GLOW weights and collapses, and 0.01 is the choice of a rare-variant analysis.
    min_mac is the smallest minor allele count in the cohort. min_variants is the smallest
    set that is tested, and 1 keeps sets of a single variant. annotation_clauses restricts
    the variants by annotation: a list of clauses, of which a variant has to satisfy one. A
    clause maps each annotation field to the values it may take, or to a test: op in or
    not_in with a list of values, op gt, ge, lt or le with one number, or op nonempty or
    empty with no value. Values are kept as the text you write, and for an annotation
    that holds numbers they are compared as numbers.

- name: ld_threshold
  section: snv_set
  type: number
  default: 0.9
  was: {file: snv_set_base.R}
  description: >-
    Of any pair of variants whose absolute correlation |r| is above this value, one is
    pruned. The value is a correlation, not its square.

- name: mac_threshold
  section: snv_set
  type: integer
  default: 10
  was: {file: snv_set_base.R}
  description: >-
    Variants whose minor allele count in the cohort is below this value are collapsed into
    one. Zero switches the collapsing off.

- name: collapse_method
  section: snv_set
  type: string
  choices: [mean, max, sum]
  default: mean
  was: {file: snv_set_base.R}
  description: >-
    How the B and PI weights of collapsed variants are combined. Their genotypes are summed.

- name: use_spa
  section: snv_set
  type: logical
  null_ok: true
  default: ~
  was: {file: snv_set_base.R}
  description: >-
    Whether the score statistics that the GLOW tests combine use the saddlepoint
    approximation. Null chooses it for a binary trait and not for a continuous one. True
    needs a binary trait. The STAAR comparison is not affected.

- name: debug_errors
  section: snv_set
  type: logical
  default: false
  was: {file: snv_set_base.R}
  description: >-
    Whether an error row of the results also carries the call that failed and the functions
    on the stack, so that a failing region can be located without rerunning it.

- name: calibration
  section: snv_set
  type: map
  fields:
    enabled: {type: logical}
    method: {type: string, choices: [ldsc_intercept, lambda_gc]}
    single_variant_scan: {type: path, null_ok: true}
    ld_scores: {type: path, null_ok: true}
    report: {type: path, null_ok: true}
  default: {enabled: false, method: ldsc_intercept, single_variant_scan: ~, ld_scores: ~, report: ~}
  was: {file: snv_set_base.R}
  description: >-
    Genomic-control calibration of the GLOW tests. When enabled, the single-variant
    statistics are divided by the square root of an inflation factor before GLOW combines
    them. The factor comes from one of two routes: report, the calibration table of a
    single-variant run on the same phenotype bundle, or single_variant_scan with, for the
    ldsc_intercept method, ld_scores. Give one route, not both. With all three null, the
    report of this analysis's single-variant step is used. The STAAR comparison is not
    affected.

- name: inflation_factor
  section: snv_set
  type: number
  null_ok: true
  default: ~
  was: {file: snv_set_base.R, in_code: true}
  description: >-
    An inflation factor set by hand, used when the calibration is not enabled. Null means
    no scaling.

- name: staar_enabled
  section: snv_set
  type: logical
  default: false
  was: {file: snv_set_base.R}
  description: >-
    Whether every set is also tested with STAAR on GLOW's own variants, which adds the STAAR
    columns to the result tables. It needs the STAAR package.

- name: staar_anno_features
  section: snv_set
  type: string_list
  null_ok: true
  default: ~
  was: {file: snv_set_base.R}
  description: >-
    The annotation columns that weight the STAAR comparison. Null uses pi_features, so that
    both methods see the same annotations.

- name: gene_max_records
  section: snv_set
  type: integer
  inf_ok: true
  default: 10000
  was: {file: snv_set_base.R}
  description: >-
    A gene with more GDS records in its span than this, and longer than one segment
    (gene_segment_bp), is cut into segments, each tested and reported like a gene. The cost
    and the memory of a set grow with the square of its size. Lower the value for a large
    cohort. Infinity (.inf) never cuts. A short gene is never cut, so the value does not
    bound the size of every set.

- name: gene_segment_bp
  section: snv_set
  type: integer
  default: 10000
  was: {file: snv_set_base.R}
  description: >-
    The length, in base pairs, of the segments of a gene that is cut.

- name: window_size
  section: snv_set
  type: integer
  default: 100000
  was: {file: snv_set_base.R}
  description: >-
    The length of a sliding window, in base pairs.

- name: step_size
  section: snv_set
  type: integer
  default: 10000
  was: {file: snv_set_base.R}
  description: >-
    The step between sliding windows, in base pairs.

- name: chunk_strategy
  section: snv_set
  type: string
  choices: [fixed_mb]
  default: fixed_mb
  was: {file: snv_set_base.R}
  description: >-
    How the genome is cut into the chunks that are the jobs of a window scan.

- name: chunk_size_mb
  section: snv_set
  type: number
  default: 5
  was: {file: snv_set_base.R}
  description: >-
    The length of a chunk of the window scan, in megabases.

- name: staar_native
  section: snv_set
  type: logical
  default: false
  was: {file: snv_set_base.R}
  description: >-
    For a window scan with staar_enabled, whether the engine of STAARpipeline itself is also
    prepared, so that it can be run on the same windows.

- name: staar_native_use_annotation
  section: snv_set
  type: logical
  default: true
  was: {file: snv_set_base.R}
  description: >-
    Whether the STAARpipeline engine weights by annotation. Set it to false for annotated
    GDS files with missing annotation values, which that engine reads as they are.

- name: categories
  section: snv_set
  type: one_of
  one_of:
    - {type: string_list}
    - type: map
      values:
        type: one_of
        one_of:
          - {type: string}
          - {type: sequence, items: *clause}
  default: [plof, plof_ds, missense, disruptive_missense, synonymous, ptv, ptv_ds]
  was: {file: snv_set_base.R}
  description: >-
    The coding categories of a coding scan: a list of built-in category names, or a mapping
    from a label to a built-in name or to annotation clauses of the kind filter_spec takes.

- name: staar_modes
  section: snv_set
  type: string_list
  choices: [spa, nospa]
  default: [spa, nospa]
  was: {file: snv_set_base.R}
  description: >-
    The modes in which the STAARpipeline engine is run, once each.

- name: staar_bakein_glow
  section: snv_set
  type: logical
  default: true
  was: {file: snv_set_base.R}
  description: >-
    For a coding scan with staar_enabled, whether GLOW also writes the STAAR result on its
    own genotype matrix.

- name: gene_num_in_array
  section: snv_set
  type: integer
  default: 500
  was: {file: snv_set_base.R}
  description: >-
    The number of genes per job of the STAARpipeline coding comparison.

- name: Annotation_dir
  section: snv_set
  type: string
  default: annotation/info/FunctionalAnnotation
  was: {file: snv_set_base.R}
  description: >-
    The node of the GDS file under which the functional annotations are stored.

- name: staar_rv_num_cutoff
  section: snv_set
  type: integer
  default: 2
  was: {file: snv_set_base.R}
  description: >-
    The smallest number of rare variants of a set that the STAARpipeline engine tests.

- name: geno_missing_imputation
  section: snv_set
  type: string
  choices: [mean, minor]
  default: mean
  was: {file: snv_set_base.R}
  description: >-
    How the STAARpipeline engine fills in a missing genotype.

- name: staar_write_subtests
  section: snv_set
  type: logical
  default: false
  was: {file: snv_set_base.R}
  description: >-
    Whether the STAARpipeline comparison also saves the full table of its component tests.

- name: noncoding_categories
  section: snv_set
  type: string_list
  choices: [upstream, downstream, UTR, promoter_CAGE, promoter_DHS, enhancer_CAGE, enhancer_DHS, ncRNA]
  default: [upstream, downstream, UTR, promoter_CAGE, promoter_DHS, enhancer_CAGE, enhancer_DHS, ncRNA]
  was: {file: snv_set_base.R}
  description: >-
    The masks of a noncoding scan. Each mask gives one set per gene: the variants that the
    annotation links to the gene and that match the mask, wherever they lie.

- name: write_flat_table
  section: snv_set
  type: logical
  default: true
  was: {file: snv_set_base.R}
  description: >-
    Whether the result table of each unit is written. It always is.

- name: write_evidence
  section: snv_set
  type: logical
  default: false
  was: {file: snv_set_base.R}
  description: >-
    Whether each unit also writes its evidence packets, which trace a result to its
    variants.

- name: write_staar_detail
  section: snv_set
  type: logical
  default: false
  was: {file: snv_set_base.R}
  description: >-
    Whether each unit also writes the detail table of the STAAR comparison.

- name: write_result_objects
  section: snv_set
  type: logical
  default: false
  was: {file: snv_set_base.R}
  description: >-
    Whether each unit also saves the result objects of the GLOW test.

- name: output_format
  section: snv_set
  type: string
  choices: [csv, fst]
  default: csv
  was: {file: snv_set_base.R}
  description: >-
    The format of the result tables. fst is accepted for a window scan only.

- name: primary_test
  section: snv_set
  type: string
  default: GLOW_Omni
  was: {file: snv_set_base.R}
  description: >-
    The test by which a gene or window scan ranks its results, decides significance and
    draws its plots.

- name: primary_test_glow
  section: snv_set
  type: string
  default: GLOW_Omni
  was: {file: snv_set_base.R}
  description: >-
    The same choice for a coding scan.

- name: alpha
  section: snv_set
  type: number
  default: 0.05
  was: {file: snv_set_base.R}
  description: >-
    The significance level of the summary.

- name: merge_gap
  section: snv_set
  type: integer
  default: 0
  was: {file: snv_set_base.R}
  description: >-
    For a window scan, the gap in base pairs across which significant windows are merged
    into one locus. Zero merges only windows that overlap.

- name: cmac_cutoff
  section: snv_set
  type: number
  null_ok: true
  default: ~
  was: {file: snv_set_base.R}
  description: >-
    For a window scan, a cumulative minor allele count at or below which a window is left
    out of the summary. Null leaves none out.

- name: top_k
  section: snv_set
  type: integer
  default: 100
  was: {file: snv_set_base.R}
  description: >-
    For a gene scan, the number of top results written to the table of top hits.

- name: max_genes
  section: snv_set
  type: integer
  null_ok: true
  default: ~
  description: >-
    For a gene, coding or noncoding scan, a limit on the number of genes tested per
    chromosome, for a trial run. Null tests all genes. The value is recorded with the
    run, so a limited run is not taken for a full one.

- name: max_windows
  section: snv_set
  type: integer
  null_ok: true
  default: ~
  description: >-
    For a window scan, a limit on the number of windows tested per chunk, for a trial
    run. Null tests all windows.

- name: allow_incomplete
  section: snv_set
  type: logical
  default: false
  description: >-
    Whether the summary is written when some chromosomes or chunks of the scan have no
    result. False stops the summary and lists what is missing.

- name: drilldown
  section: snv_set
  type: logical
  default: false
  description: >-
    For a gene scan, whether the plots step also writes one table per top gene with the
    single variants behind its result. It needs the evidence files of the scan
    (write_evidence true).

- name: staar_genomewide_alpha
  section: snv_set
  type: number
  default: 2.5e-6
  was: {file: snv_set_base.R}
  description: >-
    For a coding scan, the genome-wide significance level of the STAAR comparison.

- name: pi_model_dir
  section: snv_set
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: snv_set_base.R}
  description: >-
    The folder of trained PI models. Null takes the models of this analysis's training step.

- name: b_func
  section: snv_set
  type: r_function
  null_ok: true
  default: ~
  was: {file: snv_set_base.R}
  description: >-
    B in closed form: the text of an R function of the allele frequency, for example
    "function(maf) sqrt(maf * (1 - maf))". Give this or a trained model, not both. The
    function may use base R, the packages stats and GLOWr, and its own arguments. It may
    not use an object of your R session, because the run would then not follow from its
    configuration.

- name: b_model_path
  section: snv_set
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: snv_set_base.R}
  description: >-
    A trained B model (.rds). Null takes the model of this analysis's training step, unless
    b_func is given.

# ---- run: how the work is executed ---------------------------------------------

- name: mode
  section: run
  type: string
  choices: [local, slurm]
  default: local
  description: >-
    Where `glow run` does the work. local runs the units of a step one after another in
    your session, which suits the example, a small study and a workflow task. slurm
    submits one job per unit to the SLURM scheduler and returns.

- name: records
  section: run
  type: logical
  default: true
  description: >-
    Whether a unit of work keeps a completion record, with the lock, the overwrite guard and
    the checks of its inputs. Leave it true. The Terra workflow writes false into the
    configuration of its tasks: every task runs in a container of its own, with its inputs
    under new paths, and the workflow engine keeps track of what is finished. `glow run`
    needs the records and stops when this is false.

- name: slurm
  section: run
  type: map
  fields:
    options: {type: string}
    conda_env: {type: string, null_ok: true}
    rscript: {type: path, null_ok: true}
    setup: {type: string_list, null_ok: true}
    max_queued: {type: integer, null_ok: true}
    poll_seconds: {type: integer}
    resources:
      type: map
      values:
        type: map
        fields:
          mem: {type: string, null_ok: true}
          time: {type: string, null_ok: true}
          cpus: {type: integer, null_ok: true}
  default:
    options: ""
    conda_env: r_env
    rscript: ~
    setup: ~
    max_queued: ~
    poll_seconds: 30
    resources: {}
  description: >-
    The settings of the SLURM mode. options is added to every sbatch call, for example
    "--partition=short --account=mylab". It is for the options of your site. An option that
    the command sets itself is refused: the job name, the log, the working directory, the
    dependencies, arrays, and memory, time and cores, which resources sets. Quotes keep a
    value with blanks together, as in --comment="my study". A job sets up R by activating
    the conda environment conda_env, or, when rscript is given, by calling that program,
    with its folder in front of PATH. setup is a list of shell lines that run before that,
    such as a module load. With max_queued, a call submits nothing while you have that many
    tasks in the queue, array tasks counted one by one, and null means no cap. The count is
    taken when a call looks at the queue, and one call at a time submits for a dataset: two
    calls for two datasets that start in the same moment can each fill the cap, so it is not
    a hard limit across datasets. poll_seconds is how often --wait looks
    at the queue. resources overrides the memory, the time limit and the cores of the jobs:
    a mapping from a part name, or from default for every part, to mem, time and cpus, for
    example {annotate_favor: {mem: 64G}, default: {time: "12:00:00"}}. A part that starts
    workers always asks for n_cores cores. Before it runs, a job checks that no file of the
    configuration changed since it was submitted, and it stops when one did.
