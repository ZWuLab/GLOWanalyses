# ==============================================================================
# settings-registry.yml - every GLOWanalyses setting, once
#
# The single source of the settings: base_config.yml is generated from this file
# (Rscript base-config/make-base-config.R), and GLOWpipeline::read_glow_config()
# checks every configuration against it.
#
# One entry per setting:
#   name, section   the setting and where it is written. `section: top` is the top
#                   level of a configuration.
#   type            logical | integer | number | string | path | integer_list |
#                   number_list | string_list | named_vector | map | sequence |
#                   one_of | r_function
#   default         the value of base_config.yml
#   description     what the setting does, for a user
#   null_ok         a null (~) is a valid value
#   inf_ok          infinity is a valid value
#   choices         the allowed words of a string or of the items of a string_list
#   fields          the keys of a map, each with a type of its own
#   required        the fields that a map cannot do without
#   values          the type of every value of a map with free keys or of a
#                   named_vector
#   items           the type of every item of a sequence
#   one_of          the forms a value may take, tried in order
#   derived         a null may be found through the layout when the run needs it
#   replace_whole   a user's value replaces the inherited one whole (a map with
#                   fields otherwise merges field by field)
#   was             the base file of release 0.3.6 that defined the setting, and its
#                   name there when it differs (read by base-config/audit-registry.R)
#
# Sections: top (the study), data (the raw inputs of the dataset), shared (settings
# several steps have to agree on), then one section per step.

# ---- top: the study -----------------------------------------------------------

- name: dataset
  section: top
  type: string
  default: example
  description: >-
    The name of the dataset. It is the first folder under output_root, so every result of
    the dataset sits under one name. The default is the shipped synthetic example.

- name: analysis
  section: top
  type: string
  default: baseline
  description: >-
    The name of the analysis: one set of choices made on the dataset. It is the folder under
    the dataset. A configuration that changes a setting of a finished analysis takes a new
    name here.

- name: output_root
  section: top
  type: path
  default: runs
  description: >-
    The folder under which every output is written, as <output_root>/<dataset>/<analysis>/<step>/.
    A relative path is read from the GLOWanalyses directory. Point it at any storage with
    enough room.

# ---- data: the raw inputs of the dataset ---------------------------------------

- name: plink_dir
  section: data
  type: path
  default: data-example/cohort/example_plink
  description: >-
    The folder of the per-chromosome PLINK files (.bed, .bim, .fam) that the data-preparation
    step converts to GDS.

- name: plink_pattern
  section: data
  type: string
  default: "chr{chr}"
  was: {file: data_prep_base.R}
  description: >-
    The name of a PLINK file set without its extension, with {chr} where the chromosome
    number stands.

- name: pheno_csv
  section: data
  type: path
  default: data-example/cohort/pheno.csv
  was: {file: data_prep_base.R}
  description: >-
    The table of phenotypes and covariates, one row per sample.

- name: pheno_id_col
  section: data
  type: string
  default: sample_id
  was: {file: data_prep_base.R}
  description: >-
    The column of pheno_csv that holds the sample identifier of the GDS files.

- name: favor_db
  section: data
  type: path
  default: data-example/cohort/favor-db
  was: {file: [data_prep_base.R, training_base.R]}
  description: >-
    The FAVOR annotation database on disk. The data-preparation step annotates the cohort
    with it, and the training step annotates the known trait-associated variants.

# ---- shared: settings that several steps have to agree on ------------------------

- name: chroms
  section: shared
  type: integer_list
  default: 1-22
  was: {file: [data_prep_base.R, single_variant_base.R, snv_set_base.R]}
  description: >-
    The chromosomes to process. Every chromosome named here needs its file. A list such as
    [21, 22] makes a small test run.

- name: pi_features
  section: shared
  type: string_list
  null_ok: true
  default: ~
  was: {file: [training_base.R, snv_set_base.R]}
  description: >-
    The annotation columns that the variant-importance score PI reads. The training step
    fits its models on them and the SNV-set step scores variants with them, so the two have
    to agree. Null uses the default feature set of GLOWr.

- name: n_cores
  section: shared
  type: integer
  default: 1
  was: {file: [single_variant_base.R, snv_set_base.R]}
  description: >-
    The forked workers inside one scan unit. One is right when each chromosome or chunk is a
    job of its own. Raise it when one job owns a chromosome and several cores. The results
    are the same either way. Forking is not available on Windows.

- name: favor_match_method
  section: shared
  type: string
  choices: [exact, flexible]
  default: flexible
  was: {file: [data_prep_base.R, training_base.R]}
  description: >-
    How a variant is matched to the FAVOR database: exact uses the variant key as given,
    flexible also tries the key of an SNV with its alleles swapped or complemented.

- name: favor_use_xsv
  section: shared
  type: logical
  default: true
  was: {file: [data_prep_base.R, training_base.R]}
  description: >-
    For a FAVOR database in CSV form, whether the xsv tool fetches the rows.

- name: favor_na_handling
  section: shared
  type: string
  choices: [keep, zero, drop]
  default: keep
  was: {file: [data_prep_base.R, training_base.R]}
  description: >-
    What happens to a missing annotation value.

- name: favor_db_format
  section: shared
  type: string
  choices: [auto, csv, parquet]
  default: auto
  was: {file: [data_prep_base.R, training_base.R]}
  description: >-
    The form of the FAVOR database: csv for the chunked files of FAVOR version 1, parquet
    for the files of FAVOR 2.0, auto to detect it.

- name: favor_release
  section: shared
  type: string
  null_ok: true
  default: ~
  was: {file: [data_prep_base.R, training_base.R]}
  description: >-
    A label of the FAVOR release, recorded with the annotated files. Null records "unknown".

- name: favor_rsid_policy
  section: shared
  type: string
  choices: [require, record]
  default: require
  was: {file: [data_prep_base.R, training_base.R]}
  description: >-
    What happens to a match found by swapping or complementing alleles: require keeps it
    only when the rsID confirms it or the input has none, record keeps every match and
    records the check.

- name: analysis_gds_dir
  section: shared
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: [single_variant_base.R, snv_set_base.R], name: gds_dir}
  description: >-
    The folder of the per-chromosome GDS files that the single-variant and SNV-set steps
    read. Null takes the annotated GDS files of this dataset.

- name: analysis_gds_pattern
  section: shared
  type: file_name
  null_ok: true
  derived: true
  default: ~
  was: {file: [single_variant_base.R, snv_set_base.R], name: gds_pattern}
  description: >-
    The file name of those GDS files, with {chr} where the chromosome number stands. Null
    takes the name the data-preparation step gave the annotated files.

- name: pheno_path
  section: shared
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: [single_variant_base.R, snv_set_base.R]}
  description: >-
    The phenotype bundle (.rds) that the single-variant and SNV-set steps read: the sample
    identifiers, the outcome, the covariate matrix and the trait type. Null takes the
    bundle of this analysis's data-preparation step.

# ---- data_prep: PLINK to GDS, FAVOR annotation, PCs, the phenotype bundle ----------

- name: gds_pattern
  section: data_prep
  type: file_name
  default: "chr{chr}_hg38.gds"
  was: {file: data_prep_base.R}
  description: >-
    The file name of the GDS files that the conversion from PLINK writes.

- name: favor_gds_pattern
  section: data_prep
  type: file_name
  default: "chr{chr}_hg38_favor.gds"
  was: {file: data_prep_base.R}
  description: >-
    The file name of the annotated GDS files that the FAVOR annotation writes.

- name: favor_csv_pattern
  section: data_prep
  type: file_name
  default: "chr{chr}_hg38_favor.csv"
  was: {file: data_prep_base.R}
  description: >-
    The file name of the annotation tables that the FAVOR annotation writes.

- name: plink_to_gds_opts
  section: data_prep
  type: map
  replace_whole: true
  fields:
    split_by_chr: {type: logical}
    chromosomes: {type: string_list}
    regions:
      type: one_of
      one_of:
        - &region
          type: map
          required: [chr, start, end]
          fields: {chr: {type: string}, start: {type: number}, end: {type: number}}
        - {type: sequence, items: *region}
    output_prefix: {type: string}
    chr.conv: {type: logical}
    parallel: {type: one_of, one_of: [{type: logical}, {type: integer}]}
    compress.geno: {type: string}
    compress.annotation: {type: string}
    optimize: {type: logical}
    digest: {type: logical}
  default: {}
  was: {file: data_prep_base.R}
  description: >-
    Extra arguments of the conversion from PLINK to GDS (GLOWr::plink_to_gds), by name:
    split_by_chr, chromosomes, regions (one region with chr, start and end, or a list of
    them), output_prefix, chr.conv, parallel, and the options compress.geno,
    compress.annotation, optimize and digest of the underlying converter.

- name: favor_features
  section: data_prep
  type: string_list
  null_ok: true
  default: ~
  was: {file: data_prep_base.R}
  description: >-
    The FAVOR columns written into the annotated GDS files. Null writes the default set of
    GLOWr. A list of your own has to include the PI features, and the columns that the
    coding and noncoding scans read when you run them.

- name: favor_input_gds_dir
  section: data_prep
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: data_prep_base.R}
  description: >-
    The GDS files that the FAVOR annotation reads. Null takes the files that the conversion
    of this dataset wrote. A path lets a new dataset annotate GDS files that already exist.

- name: pc_source
  section: data_prep
  type: string
  choices: [favor, gds]
  default: favor
  was: {file: data_prep_base.R}
  description: >-
    The GDS files from which the principal components are computed: favor for the annotated
    files, gds for the converted ones.

- name: n_pcs
  section: data_prep
  type: integer
  default: 20
  was: {file: data_prep_base.R}
  description: >-
    The number of principal components to compute.

- name: pc_maf_threshold
  section: data_prep
  type: number
  default: 0.05
  was: {file: data_prep_base.R}
  description: >-
    The minor allele frequency a variant needs to enter the principal component analysis.

- name: pc_missing_rate
  section: data_prep
  type: number
  default: 0.05
  was: {file: data_prep_base.R}
  description: >-
    The largest missing rate a variant may have to enter the principal component analysis.

- name: pc_ld_threshold
  section: data_prep
  type: number
  default: 0.2
  was: {file: data_prep_base.R}
  description: >-
    The threshold of the LD pruning before the principal component analysis, on the
    correlation between two variants (not its square).

- name: pc_num_thread
  section: data_prep
  type: integer
  default: 2
  was: {file: data_prep_base.R}
  description: >-
    The threads of the principal component analysis.

- name: pc_seed
  section: data_prep
  type: integer
  default: 42
  was: {file: data_prep_base.R}
  description: >-
    The random seed of the LD pruning before the principal component analysis.

- name: trait
  section: data_prep
  type: string
  choices: [binary, continuous]
  default: binary
  was: {file: data_prep_base.R}
  description: >-
    The type of the outcome, recorded in the phenotype bundle.

- name: sample_gds_chr
  section: data_prep
  type: integer
  default: 22
  was: {file: data_prep_base.R}
  description: >-
    The chromosome whose GDS file gives the order of the samples.

- name: drop_incomplete
  section: data_prep
  type: logical
  default: true
  was: {file: data_prep_base.R}
  description: >-
    Whether a sample with a missing covariate is left out of the phenotype bundle. A sample
    with a missing outcome is always left out.

- name: pheno_out_name
  section: data_prep
  type: file_name
  default: pheno_covar.rds
  was: {file: data_prep_base.R}
  description: >-
    The file name of the phenotype bundle.

- name: outcome
  section: data_prep
  type: map
  replace_whole: true
  fields:
    node: {type: string, null_ok: true}
    col: {type: string, null_ok: true}
    map:
      type: one_of
      null_ok: true
      one_of:
        - {type: named_vector, values: {type: integer}}
        - {type: named_vector, values: {type: number}}
        - {type: r_function}
  default: {col: outcome, map: {"0": 0, "1": 1}}
  was: {file: data_prep_base.R}
  description: >-
    Where the outcome comes from: col names a column of pheno_csv, or node names a sample
    annotation of the GDS file. map recodes it: a mapping from each raw value to its number
    (a value that is not listed becomes missing), or the text of an R function of the raw
    values. Without map the values are used as numbers. The default reads the example's
    table.

- name: covariates
  section: data_prep
  type: map
  null_ok: true
  values:
    type: one_of
    one_of:
      - {type: string}
      - type: map
        fields:
          col: {type: string}
          map:
            type: one_of
            null_ok: true
            one_of:
              - {type: named_vector, values: {type: number}}
              - {type: r_function}
  default: {sex: sex, age: age}
  was: {file: data_prep_base.R}
  description: >-
    The covariates, in the order of the columns of the design matrix. Each entry is a name
    with a column of pheno_csv, or a name with a column (col) and a recoding (map) of the
    kind the outcome takes. The names become the column names. Null uses no covariate
    besides the principal components. The default reads the example's table.

- name: pcs
  section: data_prep
  type: map
  null_ok: true
  fields:
    path: {type: path, null_ok: true}
    id_col: {type: string, null_ok: true}
    cols: {type: string_list, null_ok: true}
  default: {path: ~, id_col: sample.id, cols: ~}
  was: {file: data_prep_base.R}
  description: >-
    The principal components that join the covariates. path is the PC table (null takes the
    table this dataset's PC step wrote), id_col its column of sample identifiers (null when
    the rows of the table are already in the order of the samples), and cols the components
    to use (null takes the first n_pcs). A null in place of the whole setting uses no
    principal components.

# ---- training: the B model and the PI models -------------------------------------

- name: b_raw_path
  section: training
  type: path
  default: data-example/cohort/known-snps.csv
  was: {file: training_base.R}
  description: >-
    The table of known trait-associated variants from which B, the effect size as a function
    of allele frequency, is estimated.

- name: pi_raw_path
  section: training
  type: path
  default: data-example/cohort/known-snps.csv
  was: {file: training_base.R}
  description: >-
    The table of known trait-associated variants that serve as the cases of the PI models.

- name: b_trait_type
  section: training
  type: string
  null_ok: true
  choices: [binary, continuous, mixed]
  default: binary
  was: {file: training_base.R}
  description: >-
    The trait type of the studies in b_raw_path. Null lets the loader detect binary and
    continuous traits from the columns of the table.

- name: b_format
  section: training
  type: string
  default: auto
  was: {file: training_base.R}
  description: >-
    A hint of the file format of b_raw_path for the loader. auto detects it.

- name: b_column_mapping
  section: training
  type: map
  null_ok: true
  values: {type: string}
  default: ~
  was: {file: training_base.R}
  description: >-
    The columns of b_raw_path, as a mapping from a standard name (BETA, MAF, P, N) to the
    column that holds it. Null lets the loader detect them.

- name: b_filter_include
  section: training
  type: map
  null_ok: true
  values: {type: string_list}
  default: ~
  was: {file: training_base.R}
  description: >-
    Rows of b_raw_path to keep: a mapping from a column to the values to keep. In a text
    column a value matches as a part of the cell, without regard to letter case, unless
    b_filter_pattern is false. In a numeric column a value is read as a number and has to
    equal the cell, and a value that is not a number is an error.

- name: b_filter_exclude
  section: training
  type: map
  null_ok: true
  values: {type: string_list}
  default: ~
  was: {file: training_base.R}
  description: >-
    Rows of b_raw_path to drop: a mapping from a column to the values to drop, matched as
    for b_filter_include. A column that b_filter_include also names is not filtered here.

- name: b_filter_pattern
  section: training
  type: logical
  default: true
  was: {file: training_base.R}
  description: >-
    Whether, in a text column, a value of the two filters matches as a part of the cell.
    False requires the whole cell to equal the value. A numeric column always requires
    equality.

- name: b_filter_autosomes
  section: training
  type: logical
  default: true
  was: {file: training_base.R}
  description: >-
    Whether only variants on chromosomes 1 to 22 are kept.

- name: b_qc_filters
  section: training
  type: map
  null_ok: true
  replace_whole: true
  fields:
    min_sample_size: {type: number, null_ok: true}
    max_pvalue: {type: number, null_ok: true}
    min_maf: {type: number, null_ok: true}
    remove_duplicates: {type: logical, null_ok: true}
    duplicate_priority: {type: string, null_ok: true}
    remove_na: {type: logical, null_ok: true}
    remove_na_cols: {type: string_list, null_ok: true}
  default: ~
  was: {file: training_base.R}
  description: >-
    The quality control of the B training table: min_sample_size, max_pvalue, min_maf,
    remove_duplicates, duplicate_priority (the column that decides which duplicate is
    kept), remove_na and remove_na_cols. A field that is left out or null takes the default
    of GLOWr, and a null in place of the whole setting takes all of them.

- name: b_training_rds
  section: training
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: training_base.R}
  description: >-
    The prepared B training table. Null takes the table this analysis's training step
    prepared.

- name: b_training_trait
  section: training
  type: string
  null_ok: true
  choices: [binary, continuous, mixed]
  default: binary
  was: {file: training_base.R}
  description: >-
    The trait type under which the B model is fitted. Null is treated as mixed.

- name: b_method
  section: training
  type: string
  choices: [beta, pvalue, both, auto]
  default: auto
  was: {file: training_base.R}
  description: >-
    What B is estimated from: the effect sizes, the p-values, both, or what the table offers.

- name: b_maf_col
  section: training
  type: string
  default: MAF
  was: {file: training_base.R}
  description: >-
    The column of the training table that holds the allele frequency.

- name: b_beta_col
  section: training
  type: string
  null_ok: true
  default: BETA
  was: {file: training_base.R}
  description: >-
    The column of the training table that holds the effect size. Null leaves the effect
    sizes out of the fit.

- name: b_p_col
  section: training
  type: string
  null_ok: true
  default: P
  was: {file: training_base.R}
  description: >-
    The column of the training table that holds the p-value. Null leaves the p-values out
    of the fit.

- name: b_n_col
  section: training
  type: string
  null_ok: true
  default: N
  was: {file: training_base.R}
  description: >-
    The column of the training table that holds the sample size. Null leaves it out of the
    fit.

- name: b_target_maf
  section: training
  type: one_of
  null_ok: true
  one_of:
    - {type: number_list}
    - type: map
      required: [from, to]
      fields: {from: {type: number}, to: {type: number}, n: {type: integer, null_ok: true}}
  default: ~
  was: {file: training_base.R}
  description: >-
    Allele frequencies at which a table of B values is written: a list of frequencies, or a
    grid given by from, to and n (500 points when n is left out). A configuration that
    changes the grid gives it whole. Null writes no table.

- name: b_target_trait
  section: training
  type: string
  null_ok: true
  choices: [binary, continuous, mixed]
  default: ~
  was: {file: training_base.R}
  description: >-
    The trait type of the B table of b_target_maf. Null means the training trait
    (b_training_trait). The type matters for a B model fitted by the p-value method only,
    whose table needs binary together with b_target_case_prop. Mixed and continuous stop
    the table for such a model.

- name: b_target_case_prop
  section: training
  type: number_list
  null_ok: true
  default: ~
  was: {file: training_base.R}
  description: >-
    The proportion of cases of the B table of b_target_maf, for a binary trait.

- name: pi_format
  section: training
  type: string
  default: auto
  was: {file: training_base.R}
  description: >-
    A hint of the file format of pi_raw_path for the loader. auto detects it.

- name: pi_column_mapping
  section: training
  type: map
  null_ok: true
  values: {type: string}
  default: ~
  was: {file: training_base.R}
  description: >-
    The columns of pi_raw_path, as a mapping from a standard name to the column that holds
    it. Null lets the loader detect them.

- name: pi_filter_include
  section: training
  type: map
  null_ok: true
  values: {type: string_list}
  default: ~
  was: {file: training_base.R}
  description: >-
    Rows of pi_raw_path to keep: a mapping from a column to the values to keep. In a text
    column a value matches as a part of the cell, without regard to letter case. In a
    numeric column a value is read as a number and has to equal the cell, and a value that
    is not a number is an error.

- name: pi_filter_exclude
  section: training
  type: map
  null_ok: true
  values: {type: string_list}
  default: ~
  was: {file: training_base.R}
  description: >-
    Rows of pi_raw_path to drop: a mapping from a column to the values to drop, matched as
    for pi_filter_include. A column that pi_filter_include also names is not filtered here.

- name: pi_exclude_authors
  section: training
  type: string_list
  null_ok: true
  default: ~
  was: {file: training_base.R}
  description: >-
    First authors whose studies are left out of the PI cases.

- name: pi_exclude_chromosomes
  section: training
  type: string_list
  null_ok: true
  default: ~
  was: {file: training_base.R}
  description: >-
    Chromosomes whose variants are left out of the PI cases, for example X.

- name: pi_qc_filters
  section: training
  type: map
  null_ok: true
  replace_whole: true
  fields:
    remove_duplicates: {type: logical, null_ok: true}
    duplicate_priority: {type: string, null_ok: true}
    filter_autosomes: {type: logical, null_ok: true}
    remove_na: {type: logical, null_ok: true}
    remove_na_cols: {type: string_list, null_ok: true}
  default: ~
  was: {file: training_base.R}
  description: >-
    The quality control of the PI cases: remove_duplicates, duplicate_priority (the column
    that decides which duplicate is kept), filter_autosomes, remove_na and remove_na_cols.
    A null in place of the whole setting uses the defaults of GLOWr. A list of your own
    replaces those defaults whole, so a switch it leaves out is off.

- name: pi_case_csv
  section: training
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: training_base.R}
  description: >-
    The prepared table of PI cases. Null takes the table this analysis's training step
    prepared.

- name: favor_features
  section: training
  type: string_list
  null_ok: true
  default: ~
  was: {file: training_base.R}
  description: >-
    The FAVOR columns with which the PI cases are annotated. They have to include the PI
    features. Null uses the default set of GLOWr.

- name: pi_case_annotated_csv
  section: training
  type: path
  null_ok: true
  derived: true
  default: ~
  was: {file: training_base.R}
  description: >-
    The annotated table of PI cases. Null takes the table this analysis's training step
    annotated.

- name: pi_n_models
  section: training
  type: integer
