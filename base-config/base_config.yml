# ==============================================================================
# base_config.yml - every GLOWanalyses setting with its default
#
# GENERATED from settings-registry.yml by GLOWpipeline::write_base_config().
# Do not edit this file: change the registry and regenerate it.
#
# A configuration of your own holds only the settings that differ. It builds on
# this file unless its `extends` line names another configuration to build on.
# ==============================================================================

# The name of the dataset. It is the first folder under output_root, so every result of the
# dataset sits under one name. The default is the shipped synthetic example.
dataset: example

# The name of the analysis: one set of choices made on the dataset. It is the folder under
# the dataset. A configuration that changes a setting of a finished analysis takes a new name
# here.
analysis: baseline

# The folder under which every output is written, as
# <output_root>/<dataset>/<analysis>/<step>/. A relative path is read from the GLOWanalyses
# directory. Point it at any storage with enough room.
output_root: runs

# ---- data ------------------------------------------------------------------
data:
  # The folder of the per-chromosome PLINK files (.bed, .bim, .fam) that the
  # data-preparation step converts to GDS.
  plink_dir: data-example/cohort/example_plink

  # The name of a PLINK file set without its extension, with {chr} where the chromosome
  # number stands.
  plink_pattern: "chr{chr}"

  # The table of phenotypes and covariates, one row per sample.
  pheno_csv: data-example/cohort/pheno.csv

  # The column of pheno_csv that holds the sample identifier of the GDS files.
  pheno_id_col: sample_id

  # The FAVOR annotation database on disk. The data-preparation step annotates the cohort
  # with it, and the training step annotates the known trait-associated variants.
  favor_db: data-example/cohort/favor-db

# ---- shared ----------------------------------------------------------------
shared:
  # The chromosomes to process. Every chromosome named here needs its file. A list such as
  # [21, 22] makes a small test run.
  chroms: 1-22

  # The annotation columns that the variant-importance score PI reads. The training step
  # fits its models on them and the SNV-set step scores variants with them, so the two have
  # to agree. Null uses the default feature set of GLOWr.
  pi_features: ~

  # The forked workers inside one scan unit. One is right when each chromosome or chunk is
  # a job of its own. Raise it when one job owns a chromosome and several cores. The
  # results are the same either way. Forking is not available on Windows.
  n_cores: 1

  # How a variant is matched to the FAVOR database: exact uses the variant key as given,
  # flexible also tries the key of an SNV with its alleles swapped or complemented.
  # Allowed: exact, flexible.
  favor_match_method: flexible

  # For a FAVOR database in CSV form, whether the xsv tool fetches the rows.
  favor_use_xsv: true

  # What happens to a missing annotation value.
  # Allowed: keep, zero, drop.
  favor_na_handling: keep

  # The form of the FAVOR database: csv for the chunked files of FAVOR version 1, parquet
  # for the files of FAVOR 2.0, auto to detect it.
  # Allowed: auto, csv, parquet.
  favor_db_format: auto

  # A label of the FAVOR release, recorded with the annotated files. Null records
  # "unknown".
  favor_release: ~

  # What happens to a match found by swapping or complementing alleles: require keeps it
  # only when the rsID confirms it or the input has none, record keeps every match and
  # records the check.
  # Allowed: require, record.
  favor_rsid_policy: require

  # The folder of the per-chromosome GDS files that the single-variant and SNV-set steps
  # read. Null takes the annotated GDS files of this dataset.
  # Null: found through the layout when the run needs it.
  analysis_gds_dir: ~

  # The file name of those GDS files, with {chr} where the chromosome number stands. Null
  # takes the name the data-preparation step gave the annotated files.
  # Null: found through the layout when the run needs it.
  analysis_gds_pattern: ~

  # The phenotype bundle (.rds) that the single-variant and SNV-set steps read: the sample
  # identifiers, the outcome, the covariate matrix and the trait type. Null takes the
  # bundle of this analysis's data-preparation step.
  # Null: found through the layout when the run needs it.
  pheno_path: ~

# ---- data_prep -------------------------------------------------------------
data_prep:
  # The file name of the GDS files that the conversion from PLINK writes.
  gds_pattern: "chr{chr}_hg38.gds"

  # The file name of the annotated GDS files that the FAVOR annotation writes.
  favor_gds_pattern: "chr{chr}_hg38_favor.gds"

  # The file name of the annotation tables that the FAVOR annotation writes.
  favor_csv_pattern: "chr{chr}_hg38_favor.csv"

  # Extra arguments of the conversion from PLINK to GDS (GLOWr::plink_to_gds), by name:
  # split_by_chr, chromosomes, regions (one region with chr, start and end, or a list of
  # them), output_prefix, chr.conv, parallel, and the options compress.geno,
  # compress.annotation, optimize and digest of the underlying converter.
  plink_to_gds_opts: {}

  # The FAVOR columns written into the annotated GDS files. Null writes the default set of
  # GLOWr. A list of your own has to include the PI features, and the columns that the
  # coding and noncoding scans read when you run them.
  favor_features: ~

  # The GDS files that the FAVOR annotation reads. Null takes the files that the conversion
  # of this dataset wrote. A path lets a new dataset annotate GDS files that already exist.
  # Null: found through the layout when the run needs it.
  favor_input_gds_dir: ~

  # The GDS files from which the principal components are computed: favor for the annotated
  # files, gds for the converted ones.
  # Allowed: favor, gds.
  pc_source: favor

  # The number of principal components to compute.
  n_pcs: 20

  # The minor allele frequency a variant needs to enter the principal component analysis.
  pc_maf_threshold: 0.05

  # The largest missing rate a variant may have to enter the principal component analysis.
  pc_missing_rate: 0.05

  # The threshold of the LD pruning before the principal component analysis, on the
  # correlation between two variants (not its square).
  pc_ld_threshold: 0.2

  # The threads of the principal component analysis.
  pc_num_thread: 2

  # The random seed of the LD pruning before the principal component analysis.
  pc_seed: 42

  # The type of the outcome, recorded in the phenotype bundle.
  # Allowed: binary, continuous.
  trait: binary

  # The chromosome whose GDS file gives the order of the samples.
  sample_gds_chr: 22

  # Whether a sample with a missing covariate is left out of the phenotype bundle. A sample
  # with a missing outcome is always left out.
  drop_incomplete: true

  # The file name of the phenotype bundle.
  pheno_out_name: pheno_covar.rds

  # Where the outcome comes from: col names a column of pheno_csv, or node names a sample
  # annotation of the GDS file. map recodes it: a mapping from each raw value to its number
  # (a value that is not listed becomes missing), or the text of an R function of the raw
  # values. Without map the values are used as numbers. The default reads the example's
  # table.
  outcome:
    col: outcome
    map:
      "0": 0
      "1": 1

  # The covariates, in the order of the columns of the design matrix. Each entry is a name
  # with a column of pheno_csv, or a name with a column (col) and a recoding (map) of the
  # kind the outcome takes. The names become the column names. Null uses no covariate
  # besides the principal components. The default reads the example's table.
  covariates:
    sex: sex
    age: age

  # The principal components that join the covariates. path is the PC table (null takes the
  # table this dataset's PC step wrote), id_col its column of sample identifiers (null when
  # the rows of the table are already in the order of the samples), and cols the components
  # to use (null takes the first n_pcs). A null in place of the whole setting uses no
  # principal components.
  pcs:
    path: ~
    id_col: sample.id
    cols: ~

# ---- training --------------------------------------------------------------
training:
  # The table of known trait-associated variants from which B, the effect size as a
  # function of allele frequency, is estimated.
  b_raw_path: data-example/cohort/known-snps.csv

  # The table of known trait-associated variants that serve as the cases of the PI models.
  pi_raw_path: data-example/cohort/known-snps.csv

  # The trait type of the studies in b_raw_path. Null lets the loader detect binary and
  # continuous traits from the columns of the table.
  # Allowed: binary, continuous, mixed.
  b_trait_type: binary

  # A hint of the file format of b_raw_path for the loader. auto detects it.
  b_format: auto

  # The columns of b_raw_path, as a mapping from a standard name (BETA, MAF, P, N) to the
  # column that holds it. Null lets the loader detect them.
  b_column_mapping: ~

  # Rows of b_raw_path to keep: a mapping from a column to the values to keep. In a text
  # column a value matches as a part of the cell, without regard to letter case, unless
  # b_filter_pattern is false. In a numeric column a value is read as a number and has to
  # equal the cell, and a value that is not a number is an error.
  b_filter_include: ~

  # Rows of b_raw_path to drop: a mapping from a column to the values to drop, matched as
  # for b_filter_include. A column that b_filter_include also names is not filtered here.
  b_filter_exclude: ~

  # Whether, in a text column, a value of the two filters matches as a part of the cell.
  # False requires the whole cell to equal the value. A numeric column always requires
  # equality.
  b_filter_pattern: true

  # Whether only variants on chromosomes 1 to 22 are kept.
  b_filter_autosomes: true

  # The quality control of the B training table: min_sample_size, max_pvalue, min_maf,
  # remove_duplicates, duplicate_priority (the column that decides which duplicate is
  # kept), remove_na and remove_na_cols. A field that is left out or null takes the default
  # of GLOWr, and a null in place of the whole setting takes all of them.
  b_qc_filters: ~

  # The prepared B training table. Null takes the table this analysis's training step
  # prepared.
  # Null: found through the layout when the run needs it.
  b_training_rds: ~

  # The trait type under which the B model is fitted. Null is treated as mixed.
  # Allowed: binary, continuous, mixed.
  b_training_trait: binary

  # What B is estimated from: the effect sizes, the p-values, both, or what the table
  # offers.
  # Allowed: beta, pvalue, both, auto.
  b_method: auto

  # The column of the training table that holds the allele frequency.
  b_maf_col: MAF

  # The column of the training table that holds the effect size. Null leaves the effect
  # sizes out of the fit.
  b_beta_col: BETA

  # The column of the training table that holds the p-value. Null leaves the p-values out
  # of the fit.
  b_p_col: P

  # The column of the training table that holds the sample size. Null leaves it out of the
  # fit.
  b_n_col: "N"

  # Allele frequencies at which a table of B values is written: a list of frequencies, or a
  # grid given by from, to and n (500 points when n is left out). A configuration that
  # changes the grid gives it whole. Null writes no table.
  b_target_maf: ~

  # The trait type of the B table of b_target_maf. Null means the training trait
  # (b_training_trait). The type matters for a B model fitted by the p-value method only,
  # whose table needs binary together with b_target_case_prop. Mixed and continuous stop
  # the table for such a model.
  # Allowed: binary, continuous, mixed.
  b_target_trait: ~

  # The proportion of cases of the B table of b_target_maf, for a binary trait.
  b_target_case_prop: ~

  # A hint of the file format of pi_raw_path for the loader. auto detects it.
  pi_format: auto

  # The columns of pi_raw_path, as a mapping from a standard name to the column that holds
  # it. Null lets the loader detect them.
  pi_column_mapping: ~

  # Rows of pi_raw_path to keep: a mapping from a column to the values to keep. In a text
  # column a value matches as a part of the cell, without regard to letter case. In a
  # numeric column a value is read as a number and has to equal the cell, and a value that
  # is not a number is an error.
  pi_filter_include: ~

  # Rows of pi_raw_path to drop: a mapping from a column to the values to drop, matched as
  # for pi_filter_include. A column that pi_filter_include also names is not filtered here.
  pi_filter_exclude: ~

  # First authors whose studies are left out of the PI cases.
  pi_exclude_authors: ~

  # Chromosomes whose variants are left out of the PI cases, for example X.
  pi_exclude_chromosomes: ~

  # The quality control of the PI cases: remove_duplicates, duplicate_priority (the column
  # that decides which duplicate is kept), filter_autosomes, remove_na and remove_na_cols.
  # A null in place of the whole setting uses the defaults of GLOWr. A list of your own
  # replaces those defaults whole, so a switch it leaves out is off.
  pi_qc_filters: ~

  # The prepared table of PI cases. Null takes the table this analysis's training step
  # prepared.
  # Null: found through the layout when the run needs it.
  pi_case_csv: ~

  # The FAVOR columns with which the PI cases are annotated. They have to include the PI
  # features. Null uses the default set of GLOWr.
  favor_features: ~

  # The annotated table of PI cases. Null takes the table this analysis's training step
  # annotated.
  # Null: found through the layout when the run needs it.
  pi_case_annotated_csv: ~

  # The number of models in the PI ensemble.
  pi_n_models: 100

  # The number of control variants per model, as a multiple of the number of cases.
  pi_controls_multiplier: 1

  # The largest number of control variants loaded for training, which bounds the memory.
  # Null loads all of them.
  pi_max_controls: 50000

  # The kind of model in the PI ensemble.
  # Allowed: GLM, LASSO.
  pi_model_type: LASSO

  # The chromosomes from which control variants are drawn.
  pi_chromosomes: 1-22

  # The random seed of the PI training and of its evaluation.
  pi_random_seed: 42

  # The folder, under the training output, into which the PI models are written.
  pi_models_subdir: pi_models

  # The PI models that the evaluation reads. Null takes the models this analysis's training
  # step wrote.
  # Null: found through the layout when the run needs it.
  pi_models_dir: ~

  # The folder of annotated per-chromosome files from which control variants are drawn.
  # Null takes the annotated files of this dataset.
  # Null: found through the layout when the run needs it.
  pi_control_source: ~

  # The format of the control files of the PI training and of its evaluation: gds for the
  # annotated GDS files, csv for the CSV files that the annotation writes beside them. With
  # the annotated files of this dataset, auto takes the CSV files when the annotation of
  # every control chromosome wrote one, and the GDS files otherwise, and the completion
  # record states which. With a folder of your own in pi_control_source, auto looks at the
  # files in it.
  # Allowed: auto, gds, csv.
  pi_control_format: auto

  # The largest number of control variants loaded for the evaluation. Fewer is faster and
  # noisier. Null loads all of them.
  pi_eval_max_controls: 5000

  # The number of control variants sampled for the ROC curve. Null uses all that were
  # loaded.
  pi_n_eval_controls: ~

# ---- single_variant --------------------------------------------------------
single_variant:
  # Whether the single-variant scan uses the saddlepoint approximation, which is meant for
  # a binary trait with rare variants.
  use_spa: true

  # The number of variants read at a time by the scan.
  chunk_size: 2000

  # The smallest minor allele count of a variant that is scanned. One scans every variant
  # that varies in the cohort.
  mac_cutoff: 1

  # How a missing genotype is filled in.
  # Allowed: mean, zero.
  missing_imputation: mean

  # The half-width, in base pairs, of the window over which a variant's LD score is summed.
  ld_window: 1000000

  # The number of variants per block of the LD-score computation.
  ld_segment: 2000

  # The number of individuals sampled for the LD scores. Zero uses all of them.
  ld_sample_n: 0

  # The minor allele frequency a variant needs to enter the LD scores, as a target and as a
  # neighbor. Zero takes every biallelic SNV. 0.01 is the usual choice on whole-genome
  # data, where the table of all SNVs is out of reach. Above zero the LD step reads the
  # frequencies from this analysis's single-variant table, so the scan has to run first.
  # The threshold can change the estimated LD score regression intercept, so validate the
  # calibration on the cohort.
  ld_ref_maf_min: 0

  # How the inflation factor is estimated: ldsc_intercept is the intercept of LD score
  # regression, which needs the LD scores and keeps polygenic signal apart from
  # confounding, and lambda_gc is the genomic-control lambda.
  # Allowed: ldsc_intercept, lambda_gc.
  calibration_method: ldsc_intercept

  # The smallest minor allele count of the variants on which the headline lambda of the
  # calibration report is computed.
  lambda_mac_min: 20

  # A table of LD scores computed elsewhere, for the calibration to read. Null takes the
  # scores this analysis's LD step wrote.
  # Null: found through the layout when the run needs it.
  ld_scores_path: ~

# ---- snv_set ---------------------------------------------------------------
snv_set:
  # The kinds of SNV sets to scan, each written to a folder of its own: gene tests the
  # variants of each gene, window tests sliding windows, coding tests each gene by coding
  # category, and noncoding tests each gene by noncoding mask.
  # Allowed: gene, window, coding, noncoding.
  region_type: [gene]

  # Which variants enter a set. qc_label and qc_pass_value name the quality-control field
  # of the GDS file and the value that passes. variant_type is SNV, Indel or variant
  # (both). rare_maf_cutoff is the largest minor allele frequency: 0.5 keeps the whole
  # spectrum, which GLOW weights and collapses, and 0.01 is the choice of a rare-variant
  # analysis. min_mac is the smallest minor allele count in the cohort. min_variants is the
  # smallest set that is tested, and 1 keeps sets of a single variant. annotation_clauses
  # restricts the variants by annotation: a list of clauses, of which a variant has to
  # satisfy one. A clause maps each annotation field to the values it may take, or to a
  # test: op in or not_in with a list of values, op gt, ge, lt or le with one number, or op
  # nonempty or empty with no value. Values are kept as the text you write, and for an
  # annotation that holds numbers they are compared as numbers.
  filter_spec:
    qc_label: annotation/filter
    qc_pass_value: PASS
    variant_type: SNV
    annotation_clauses: ~
    rare_maf_cutoff: 0.5
    min_mac: 1
    min_variants: 1

  # Of any pair of variants whose absolute correlation |r| is above this value, one is
  # pruned. The value is a correlation, not its square.
  ld_threshold: 0.9

  # Variants whose minor allele count in the cohort is below this value are collapsed into
  # one. Zero switches the collapsing off.
  mac_threshold: 10

  # How the B and PI weights of collapsed variants are combined. Their genotypes are
  # summed.
  # Allowed: mean, max, sum.
  collapse_method: mean

  # Whether the score statistics that the GLOW tests combine use the saddlepoint
  # approximation. Null chooses it for a binary trait and not for a continuous one. True
  # needs a binary trait. The STAAR comparison is not affected.
  use_spa: ~

  # Whether an error row of the results also carries the call that failed and the functions
  # on the stack, so that a failing region can be located without rerunning it.
  debug_errors: false

  # Genomic-control calibration of the GLOW tests. When enabled, the single-variant
  # statistics are divided by the square root of an inflation factor before GLOW combines
  # them. The factor comes from one of two routes: report, the calibration table of a
  # single-variant run on the same phenotype bundle, or single_variant_scan with, for the
  # ldsc_intercept method, ld_scores. Give one route, not both. With all three null, the
  # report of this analysis's single-variant step is used. The STAAR comparison is not
  # affected.
  calibration:
    enabled: false
    method: ldsc_intercept
    single_variant_scan: ~
    ld_scores: ~
    report: ~

  # An inflation factor set by hand, used when the calibration is not enabled. Null means
  # no scaling.
  inflation_factor: ~

  # Whether every set is also tested with STAAR on GLOW's own variants, which adds the
  # STAAR columns to the result tables. It needs the STAAR package.
  staar_enabled: false

  # The annotation columns that weight the STAAR comparison. Null uses pi_features, so that
  # both methods see the same annotations.
  staar_anno_features: ~

  # A gene with more GDS records in its span than this, and longer than one segment
  # (gene_segment_bp), is cut into segments, each tested and reported like a gene. The cost
  # and the memory of a set grow with the square of its size. Lower the value for a large
  # cohort. Infinity (.inf) never cuts. A short gene is never cut, so the value does not
  # bound the size of every set.
  gene_max_records: 10000

  # The length, in base pairs, of the segments of a gene that is cut.
  gene_segment_bp: 10000

  # The length of a sliding window, in base pairs.
  window_size: 100000

  # The step between sliding windows, in base pairs.
  step_size: 10000

  # How the genome is cut into the chunks that are the jobs of a window scan.
  # Allowed: fixed_mb.
  chunk_strategy: fixed_mb

  # The length of a chunk of the window scan, in megabases.
  chunk_size_mb: 5

  # For a window scan with staar_enabled, whether the engine of STAARpipeline itself is
  # also prepared, so that it can be run on the same windows.
  staar_native: false

  # Whether the STAARpipeline engine weights by annotation. Set it to false for annotated
  # GDS files with missing annotation values, which that engine reads as they are.
  staar_native_use_annotation: true

  # The coding categories of a coding scan: a list of built-in category names, or a mapping
  # from a label to a built-in name or to annotation clauses of the kind filter_spec takes.
  categories: [plof, plof_ds, missense, disruptive_missense, synonymous, ptv, ptv_ds]

  # The modes in which the STAARpipeline engine is run, once each.
  # Allowed: spa, nospa.
  staar_modes: [spa, nospa]

  # For a coding scan with staar_enabled, whether GLOW also writes the STAAR result on its
  # own genotype matrix.
  staar_bakein_glow: true

  # The number of genes per job of the STAARpipeline coding comparison.
  gene_num_in_array: 500

  # The node of the GDS file under which the functional annotations are stored.
  Annotation_dir: annotation/info/FunctionalAnnotation

  # The smallest number of rare variants of a set that the STAARpipeline engine tests.
  staar_rv_num_cutoff: 2

  # How the STAARpipeline engine fills in a missing genotype.
  # Allowed: mean, minor.
  geno_missing_imputation: mean

  # Whether the STAARpipeline comparison also saves the full table of its component tests.
  staar_write_subtests: false

  # The masks of a noncoding scan. Each mask gives one set per gene: the variants that the
  # annotation links to the gene and that match the mask, wherever they lie.
  # Allowed: upstream, downstream, UTR, promoter_CAGE, promoter_DHS, enhancer_CAGE,
  # enhancer_DHS, ncRNA.
  noncoding_categories:
    - upstream
    - downstream
    - UTR
    - promoter_CAGE
    - promoter_DHS
    - enhancer_CAGE
    - enhancer_DHS
    - ncRNA

  # Whether the result table of each unit is written. It always is.
  write_flat_table: true

  # Whether each unit also writes its evidence packets, which trace a result to its
  # variants.
  write_evidence: false

  # Whether each unit also writes the detail table of the STAAR comparison.
  write_staar_detail: false

  # Whether each unit also saves the result objects of the GLOW test.
  write_result_objects: false

  # The format of the result tables. fst is accepted for a window scan only.
  # Allowed: csv, fst.
  output_format: csv

  # The test by which a gene or window scan ranks its results, decides significance and
  # draws its plots.
  primary_test: GLOW_Omni

  # The same choice for a coding scan.
  primary_test_glow: GLOW_Omni

  # The significance level of the summary.
  alpha: 0.05

  # For a window scan, the gap in base pairs across which significant windows are merged
  # into one locus. Zero merges only windows that overlap.
  merge_gap: 0

  # For a window scan, a cumulative minor allele count at or below which a window is left
  # out of the summary. Null leaves none out.
  cmac_cutoff: ~

  # For a gene scan, the number of top results written to the table of top hits.
  top_k: 100

  # For a gene, coding or noncoding scan, a limit on the number of genes tested per
  # chromosome, for a trial run. Null tests all genes. The value is recorded with the run,
  # so a limited run is not taken for a full one.
  max_genes: ~

  # For a window scan, a limit on the number of windows tested per chunk, for a trial run.
  # Null tests all windows.
  max_windows: ~

  # Whether the summary is written when some chromosomes or chunks of the scan have no
  # result. False stops the summary and lists what is missing.
  allow_incomplete: false

  # For a gene scan, whether the plots step also writes one table per top gene with the
  # single variants behind its result. It needs the evidence files of the scan
  # (write_evidence true).
  drilldown: false

  # For a coding scan, the genome-wide significance level of the STAAR comparison.
  staar_genomewide_alpha: 2.5e-06

  # The folder of trained PI models. Null takes the models of this analysis's training
  # step.
  # Null: found through the layout when the run needs it.
  pi_model_dir: ~

  # B in closed form: the text of an R function of the allele frequency, for example
  # "function(maf) sqrt(maf * (1 - maf))". Give this or a trained model, not both. The
  # function may use base R, the packages stats and GLOWr, and its own arguments. It may
  # not use an object of your R session, because the run would then not follow from its
  # configuration.
  b_func: ~

  # A trained B model (.rds). Null takes the model of this analysis's training step, unless
  # b_func is given.
  # Null: found through the layout when the run needs it.
  b_model_path: ~

# ---- run -------------------------------------------------------------------
run:
  # Where `glow run` does the work. local runs the units of a step one after another in
  # your session, which suits the example, a small study and a workflow task. slurm submits
  # one job per unit to the SLURM scheduler and returns.
  # Allowed: local, slurm.
  mode: local

  # Whether a unit of work keeps a completion record, with the lock, the overwrite guard
  # and the checks of its inputs. Leave it true. The Terra workflow writes false into the
  # configuration of its tasks: every task runs in a container of its own, with its inputs
  # under new paths, and the workflow engine keeps track of what is finished. `glow run`
  # needs the records and stops when this is false.
  records: true

  # The settings of the SLURM mode. options is added to every sbatch call, for example
  # "--partition=short --account=mylab". It is for the options of your site. An option that
  # the command sets itself is refused: the job name, the log, the working directory, the
  # dependencies, arrays, and memory, time and cores, which resources sets. Quotes keep a
  # value with blanks together, as in --comment="my study". A job sets up R by activating
  # the conda environment conda_env, or, when rscript is given, by calling that program,
  # with its folder in front of PATH. setup is a list of shell lines that run before that,
  # such as a module load. With max_queued, a call submits nothing while you have that many
  # tasks in the queue, array tasks counted one by one, and null means no cap. The count is
  # taken when a call looks at the queue, and one call at a time submits for a dataset: two
  # calls for two datasets that start in the same moment can each fill the cap, so it is
  # not a hard limit across datasets. poll_seconds is how often --wait looks at the queue.
  # resources overrides the memory, the time limit and the cores of the jobs: a mapping
  # from a part name, or from default for every part, to mem, time and cpus, for example
  # {annotate_favor: {mem: 64G}, default: {time: "12:00:00"}}. A part that starts workers
  # always asks for n_cores cores. Before it runs, a job checks that no file of the
  # configuration changed since it was submitted, and it stops when one did.
  slurm:
    options: ""
    conda_env: r_env
    rscript: ~
    setup: ~
    max_queued: ~
    poll_seconds: 30
    resources: {}
